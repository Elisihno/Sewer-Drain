<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DarkArchive</title><link rel="icon" type="image/png" href="apple-touch-icon.png?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><meta name="theme-color" content="#080d13">
<style>
:root{font-family:Inter,system-ui,Arial;background:#080d13;color:#edf3f8;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0}header{border-bottom:1px solid #24313e;padding:20px max(22px,5vw);display:flex;justify-content:space-between;align-items:center;background:#0c141e}.brand{font-size:22px;font-weight:850;letter-spacing:1px}.brand span{color:#55d6bb}.eyebrow{font-size:11px;letter-spacing:2px;color:#7c98a8;font-weight:800}main{max-width:1160px;margin:auto;padding:30px 22px}.hero{background:linear-gradient(120deg,#122d35,#14202c 65%,#19202c);padding:30px;border:1px solid #29424d;border-radius:20px;margin-bottom:26px}.hero h1{font-size:clamp(28px,5vw,48px);margin:10px 0}.muted{color:#93a6b5}.primary{background:#53d8bb;color:#06241e;font-weight:800;padding:12px 18px;border-radius:10px}.ghost{background:#1a2835;color:#d8e8f0;padding:11px 15px;border:1px solid #334552;border-radius:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.card{background:#121c27;border:1px solid #293b49;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:#53d8bb}.cover{height:190px;background:radial-gradient(circle at 50% 0%,#285c60,#0a161d 70%);display:flex;align-items:center;justify-content:center;color:#81b2ad;font-size:46px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cardbody{padding:18px}.card h3{margin:4px 0 10px;font-size:20px}.tag{color:#65dec6;font-size:11px;letter-spacing:1px;font-weight:800;text-transform:uppercase}.stats{display:flex;gap:15px;font-size:12px;color:#9fb0bb;margin-top:18px}.back{margin-bottom:18px}.profile{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:25px}.profile .cover{height:350px;border-radius:16px;border:1px solid #304957}.profile h1{font-size:clamp(28px,4vw,44px);margin:10px 0}.tabs{display:flex;gap:8px;margin:24px 0 18px;flex-wrap:wrap}.tabs button{padding:11px 16px;background:#182431;color:#aebfca;border-radius:9px}.tabs button.active{background:#53d8bb;color:#06241e;font-weight:800}.panel{background:#121e29;border:1px solid #2a3b49;border-radius:15px;padding:20px;margin-bottom:15px}.entry{border:1px solid #2b4050;border-radius:12px;padding:18px;margin:12px 0;background:#101923}.entry h3{margin:0 0 8px}.entry img{width:100%;max-width:260px;max-height:220px;object-fit:contain;border-radius:9px}.field{margin:12px 0}.field label{display:block;margin-bottom:7px;font-size:12px;color:#9eb5c2;font-weight:700}input,textarea,select{width:100%;background:#0b1520;border:1px solid #344956;border-radius:9px;padding:11px;color:#edf3f8}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.empty{padding:25px;text-align:center;color:#9db1bd;border:1px dashed #37515b;border-radius:12px}.pill{display:inline-block;border:1px solid #326356;border-radius:20px;color:#6cdec8;padding:5px 10px;font-size:12px;margin:5px 5px 0 0}@media(max-width:650px){.profile{grid-template-columns:1fr}.profile .cover{height:240px}header{padding:15px}.hero{padding:22px}}
</style></head><body><header><div class="brand">DARK<span>ARCHIVE</span><div class="eyebrow">HORROR GAME COLLECTION</div></div><button class="ghost" id="export">Export data</button></header><main id="app"></main>
<script>
const starter=[{id:'sewer-drain',name:'Sewer Drain',genre:'Survival Horror',status:'In Development',description:'Explore a mysterious underground sewer system, avoid its dangers, and discover the ways out.',cover:'',killers:[],exits:[]}];
let games;try{games=JSON.parse(localStorage.getItem('darkarchive-games'))||starter}catch{games=starter}let current=null,tab='overview';
const app=document.getElementById('app');
const save=()=>localStorage.setItem('darkarchive-games',JSON.stringify(games));
const node=(tag,cls,text)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
const add=(parent,tag,cls,text)=>{let x=node(tag,cls,text);parent.append(x);return x};
function btn(parent,label,fn,cls='ghost'){let x=add(parent,'button',cls,label);x.onclick=fn;return x}
function input(parent,label,value,fn,multi=false){let box=add(parent,'div','field');add(box,'label','',label);let x=add(box,multi?'textarea':'input');x.value=value||'';x.oninput=()=>fn(x.value);return x}
function picture(parent,url,icon='◈'){let x=add(parent,'div','cover');if(url){let img=add(x,'img');img.src=url}else x.textContent=icon;return x}
function imageInput(parent,label,cb){let wrap=add(parent,'div','field');add(wrap,'label','',label);let f=add(wrap,'input');f.type='file';f.accept='image/*';f.onchange=()=>{let file=f.files[0];if(!file)return;if(file.size>3500000){alert('Choose an image under 3.5 MB.');return}let reader=new FileReader();reader.onload=()=>{cb(reader.result);save();render()};reader.readAsDataURL(file)}}
function render(){app.replaceChildren();if(!current){let hero=add(app,'section','hero');add(hero,'div','eyebrow','YOUR HORROR UNIVERSE');add(hero,'h1','','Every nightmare has a story.');add(hero,'p','muted','Build a collection of your games, document their killers, and reveal every escape route.');btn(hero,'+ Add new game',()=>{let g={id:'game-'+Date.now(),name:'New Horror Game',genre:'Survival Horror',status:'Concept',description:'',cover:'',killers:[],exits:[]};games.push(g);save();current=g.id;tab='edit';render()},'primary');let bar=add(app,'div','toolbar');add(bar,'h2','','Game Collection');add(bar,'span','muted',games.length+' games');let grid=add(app,'div','cards');games.forEach(g=>{let c=add(grid,'article','card');picture(c,g.cover);let b=add(c,'div','cardbody');add(b,'div','tag',g.status);add(b,'h3','',g.name);add(b,'p','muted',g.genre);add(b,'div','stats',g.killers.length+' Killers  •  '+g.exits.length+' Exits');c.onclick=()=>{current=g.id;tab='overview';render()}});return}
let g=games.find(x=>x.id===current);if(!g){current=null;render();return}btn(app,'← All games',()=>{current=null;render()},'ghost').classList.add('back');let profile=add(app,'div','profile');let left=add(profile,'div');picture(left,g.cover);let right=add(profile,'div');add(right,'div','tag',g.status);add(right,'h1','',g.name);add(right,'p','muted',g.genre);add(right,'p','',g.description||'No game description yet.');add(right,'span','pill',g.killers.length+' killers');add(right,'span','pill',g.exits.length+' exits');let tabs=add(app,'div','tabs');[['overview','Overview'],['killers','Killers'],['exits','Escape Routes'],['edit','Edit Game']].forEach(([id,label])=>btn(tabs,label,()=>{tab=id;render()},tab===id?'active':''));let panel=add(app,'section','panel');
if(tab==='overview'){add(panel,'h2','','Game Overview');add(panel,'p','muted',g.description||'Use Edit Game to write your game description.');add(panel,'h3','','Killers');if(!g.killers.length)add(panel,'p','muted','No killers documented yet.');else g.killers.forEach(k=>add(panel,'span','pill',k.name));add(panel,'h3','','Escape Routes');if(!g.exits.length)add(panel,'p','muted','No exits documented yet.');else g.exits.forEach(e=>add(panel,'span','pill',e.name))}
if(tab==='edit'){add(panel,'h2','','Edit Game Profile');input(panel,'Game title',g.name,v=>{g.name=v;save()});input(panel,'Genre',g.genre,v=>{g.genre=v;save()});input(panel,'Development status',g.status,v=>{g.status=v;save()});input(panel,'Description',g.description,v=>{g.description=v;save()},true);imageInput(panel,'Game cover / profile picture',v=>g.cover=v);let a=add(panel,'div','actions');btn(a,'Save changes',render,'primary');btn(a,'Delete game',()=>{if(confirm('Delete this game and all its entries?')){games=games.filter(x=>x.id!==g.id);save();current=null;render()}})}
if(tab==='killers'||tab==='exits'){let isK=tab==='killers',items=isK?g.killers:g.exits;add(panel,'h2','',isK?'Killers':'Escape Routes');add(panel,'p','muted',isK?'Characters, appearances, lore and behavior.':'Escape methods, required items and puzzles.');items.forEach((item,i)=>{let box=add(panel,'div','entry');if(item.image){let im=add(box,'img');im.src=item.image}add(box,'h3','',item.name||'Unnamed');add(box,'p','muted',item.description||'No description yet.');if(!isK)add(box,'p','',item.requirements?'Required: '+item.requirements:'No requirements added.');let edit=add(box,'details');add(edit,'summary','','Edit entry');input(edit,'Name',item.name,v=>{item.name=v;save()});input(edit,isK?'Lore / abilities / behavior':'How to escape',item.description,v=>{item.description=v;save()},true);if(!isK)input(edit,'Required items / puzzles',item.requirements,v=>{item.requirements=v;save()},true);if(isK)imageInput(edit,'Killer portrait',v=>item.image=v);let a=add(edit,'div','actions');btn(a,'Save entry',render,'primary');btn(a,'Remove',()=>{if(confirm('Remove entry?')){items.splice(i,1);save();render()}})});btn(panel,isK?'+ Add Killer':'+ Add Escape Route',()=>{items.push({name:isK?'New Killer':'New Exit',description:'',requirements:'',image:''});save();render()},'primary')}
}
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(games,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='darkarchive-games.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
